# Cloud Run service for kb-api. Not deployed in Sprint 3; see deploy/README.md.
# Apply with: gcloud run services replace deploy/cloudrun.yaml --region asia-south1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kb-api
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: kb-api@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: asia-south1-docker.pkg.dev/PROJECT_ID/kb-api/kb-api:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: AUTH_MODE
              value: firebase
            - name: FIREBASE_PROJECT_ID
              value: PROJECT_ID
            - name: FIREBASE_PROJECT_NUMBER
              value: "PROJECT_NUMBER"
            - name: AI_ENABLED
              value: "true"
            # External HTTPS load balancer in front (README §6): X-Forwarded-For is "<client>, <lb>".
            - name: TRUSTED_PROXY_HOPS
              value: "2"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            # Sprint 4 billing (README §9).
            - name: PLAY_PACKAGE_NAME
              value: com.manjul.aikeyboard
            - name: ENTITLEMENT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: entitlement-signing-key
                  key: latest
            - name: RTDN_AUDIENCE
              value: https://DOMAIN/internal/rtdn
            - name: RTDN_SERVICE_ACCOUNT
              value: rtdn-push@PROJECT_ID.iam.gserviceaccount.com
            - name: DELETION_CONTACT_EMAIL
              value: CONTACT_EMAIL
          startupProbe:
            httpGet:
              path: /healthz
          livenessProbe:
            httpGet:
              path: /healthz
